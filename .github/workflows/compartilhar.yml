name: Prévia do link do catálogo
# Troca sozinho a imagem e o texto que aparecem quando o link do catálogo é colado no WhatsApp,
# sempre deixando o PRÓXIMO leilão da agenda (quando o leilão do site está encerrado).
# Roda só às segundas e quintas, como todas as atualizações de leilão. Para forçar fora do dia: aba Actions > Run workflow.
on:
  schedule:
    - cron: "40 11,17 * * 1,4"   # só segunda e quinta, 08h40 e 14h40 em Brasília (depois dos banners da agenda)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compartilhar
  cancel-in-progress: false
jobs:
  compartilhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .github/ferramentas/compartilhar.py
      - name: Salvar
        run: |
          if [ -n "$(git status --porcelain index.html compartilhar-banner.jpg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add index.html compartilhar-banner.jpg
            git commit -m "Prévia do link atualizada para o próximo leilão"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
