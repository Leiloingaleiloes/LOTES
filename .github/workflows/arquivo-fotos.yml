name: Guardar fotos dos leilões (30 dias)
# Copia as fotos do leilão atual para arquivo/ sempre que o Lotes ADM muda o midia.json,
# e todo dia apaga os leilões com mais de 30 dias.
on:
  push:
    branches: [main]
    paths: ["midia.json", "leilao.json"]
  schedule:
    - cron: "41 6 * * *"   # 03h41 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arquivo-fotos
  cancel-in-progress: false
jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/ferramentas/arquivo_fotos.py
      - name: Salvar
        run: |
          if [ -n "$(git status --porcelain arquivo)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add arquivo
            git commit -m "Fotos do leilão guardadas (30 dias)"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
